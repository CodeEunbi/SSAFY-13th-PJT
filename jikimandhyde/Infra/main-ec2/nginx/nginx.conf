events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # 로그 포맷 설정
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # 성능 최적화
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 100M;

    # Gzip 압축 설정
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # Rate limiting (DDoS 방어)
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=general:10m rate=50r/s;

    # FastAPI 백엔드 업스트림
    upstream fastapi_backend {
        server fastapi-ai-service:8000;
        keepalive 32;
    }

    # Redis 헬스체크 업스트림 (선택사항)
    upstream redis_backend {
        server redis:6379;
    }

    # HTTP 서버 설정
    server {
        listen 80;
        server_name localhost;

        # 보안 헤더
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # AI 추론 API (메인 서비스)
        location /api/ {
            limit_req zone=api burst=20 nodelay;
            
            proxy_pass http://fastapi_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # FastAPI용 특별 헤더
            proxy_set_header Connection "";
            proxy_http_version 1.1;
            
            # 타임아웃 설정 (AI 추론 시간 고려)
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            
            # 캐싱 비활성화 (실시간 AI 추론)
            proxy_cache_bypass 1;
            proxy_no_cache 1;
        }

        # 헬스체크 엔드포인트
        location /health {
            limit_req zone=general burst=10 nodelay;
            
            proxy_pass http://fastapi_backend/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            
            # 빠른 응답을 위한 짧은 타임아웃
            proxy_connect_timeout 2s;
            proxy_send_timeout 5s;
            proxy_read_timeout 5s;
        }

        # 메트릭 엔드포인트 (모니터링용)
        location /metrics {
            # 내부 네트워크에서만 접근 허용
            allow 172.20.0.0/16;  # Docker 네트워크
            allow 127.0.0.1;      # 로컬호스트
            deny all;
            
            proxy_pass http://fastapi_backend/metrics;
            proxy_set_header Host $host;
        }

        # 크롬 익스텐션 다운로드 페이지
        location /extension/ {
            limit_req zone=general burst=10 nodelay;
            
            alias /var/www/html/extension/;
            try_files $uri $uri/ /extension/index.html;
            
            # HTML 파일은 캐시하지 않음 (최신 버전 정보)
            location ~* \.html$ {
                expires -1;
                add_header Cache-Control "no-cache, no-store, must-revalidate";
            }
        }

        # 익스텐션 ZIP 파일 다운로드
        location /downloads/ {
            limit_req zone=general burst=5 nodelay;
            
            alias /var/www/html/downloads/;
            
            # ZIP 파일 다운로드 헤더 설정
            location ~* \.zip$ {
                add_header Content-Disposition "attachment";
                add_header Content-Type "application/zip";
                expires 1h;
                add_header Cache-Control "public";
            }
        }

        # 정적 파일 처리 (확장프로그램 에셋 등)
        location /static/ {
            limit_req zone=general burst=50 nodelay;
            
            root /var/www/html;
            expires 1d;
            add_header Cache-Control "public, immutable";
        }

        # 기본 상태 페이지
        location / {
            limit_req zone=general burst=20 nodelay;
            
            return 200 '{"status":"OK","service":"AI Extension Main Server","timestamp":"$time_iso8601"}';
            add_header Content-Type application/json;
        }

        # 에러 페이지 커스터마이징
        error_page 404 /404.html;
        error_page 500 502 503 504 /50x.html;
        
        location = /404.html {
            root /var/www/html;
            internal;
        }
        
        location = /50x.html {
            root /var/www/html;
            internal;
        }
    }
}
